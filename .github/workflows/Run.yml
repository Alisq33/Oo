name: Continuous Bot Runner

on:
  schedule:
    - cron: '0 21,1,5,9,13,17 * * *'   # بتوقيت مكة: 12 ص, 4 ص, 8 ص, 12 م, 4 م, 8 م
  workflow_dispatch:

concurrency:
  group: wolf-bot-running
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 365        # تم التعديل من 305 إلى 365 لدعم 6 ساعات
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Chrome profile
        uses: actions/cache@v3
        with:
          path: |
            chrome-profile-account1
            chrome-profile-account2
          key: ${{ runner.os }}-chrome-profile-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-chrome-profile-

      - name: Install dependencies
        run: npm install

      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Execution Logic
        env:
          TOKEN_1: ${{ secrets.TOKEN_1 }}
          TOKEN_2: ${{ secrets.TOKEN_2 }}
          USER_ID_1: ${{ secrets.USER_ID_1 }}
          USER_ID_2: ${{ secrets.USER_ID_2 }}
          GROUP_ID: ${{ secrets.GROUP_ID }}
        run: |
          echo "🚀 بدء التشغيل لمدة 6 ساعات (21600 ثانية)..."
          
          # تشغيل البوت في الخلفية
          node bot.js & 
          BOT_PID=$!
          
          # الانتظار لمدة 6 ساعات (21600 ثانية)
          sleep 21600 
          
          echo "🛑 انتهت الـ 6 ساعات، جاري إغلاق الجلسة للسماح بالتشغيل الجديد..."
          kill $BOT_PID || true
